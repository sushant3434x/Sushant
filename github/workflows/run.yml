name: Shein Bot Runner

on:
  workflow_dispatch: # Allows you to start the bot manually whenever you want

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install pyTelegramBotAPI requests

      - name: Run the Bot
        env:
          # This pulls the token and ID from your GitHub Secrets
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python bot.py

