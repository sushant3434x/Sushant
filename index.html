<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha Core Fitness | Official Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --alpha-red: #ff3131; --glass: rgba(10, 10, 10, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; min-height: 100vh; font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow-x: hidden; position: relative; }

        /* STATIC BG */
        .static-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            filter: brightness(0.2);
        }

        /* MOTION EMOJIS */
        .emoji-rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; opacity: 0.3; }
        .moving-emoji { position: absolute; font-size: 25px; animation: float 8s infinite linear; }
        @keyframes float {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* BACKGROUND SLOGAN */
        .bg-slogan-wrap { position: fixed; top: 20%; width: 100%; text-align: center; z-index: -1; pointer-events: none; }
        #top-bg-slogan { font-family: 'Montserrat', sans-serif; font-size: 10vw; font-weight: 900; text-transform: uppercase; color: rgba(255, 255, 255, 0.05); }

        /* MAIN UI */
        .main-container { display: flex; flex-direction: column; align-items: center; padding: 12vh 15px 8vh; position: relative; z-index: 10; width: 100%; }
        
        .review-card {
            background: var(--glass); border: 1px solid rgba(255, 49, 49, 0.3); border-radius: 35px;
            padding: 45px 25px 35px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .logo-ring {
            width: 80px; height: 80px; background: var(--alpha-red); margin: -85px auto 20px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            border: 5px solid #000; box-shadow: 0 10px 20px rgba(255, 49, 49, 0.5);
        }

        h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; margin: 0; }
        .location { color: var(--alpha-red); font-weight: 800; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }

        .star-box { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
        .star-box i { font-size: 35px; color: #222; cursor: pointer; transition: transform 0.2s; }
        .star-box i.active { color: #FFD700; transform: scale(1.1); text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }

        textarea {
            width: 100%; height: 110px; background: rgba(255,255,255,0.06); border: 1px solid #333;
            border-radius: 18px; padding: 15px; color: #fff; font-family: inherit; font-size: 14px;
            resize: none; outline: none; margin-bottom: 20px; -webkit-appearance: none;
        }
        
        .alpha-btn {
            background: var(--alpha-red); color: #fff; border: none; width: 100%; padding: 18px;
            border-radius: 50px; font-weight: 900; text-transform: uppercase; cursor: pointer;
            font-size: 15px; letter-spacing: 1px; transition: background 0.3s;
        }

        .bottom-quote-box { margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        #bottom-dynamic-quote { font-style: italic; font-size: 12px; color: #666; }

        /* INSTAGRAM BUTTON */
        .insta-float { 
            position: fixed; bottom: 20px; left: 20px; background: #fff; color: #000; 
            padding: 10px 20px; border-radius: 50px; text-decoration: none; 
            font-weight: 700; font-size: 11px; display: flex; align-items: center; 
            gap: 6px; z-index: 999; box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }

        /* MODAL */
        #custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #0a0a0a; border: 2px solid var(--alpha-red); border-radius: 30px;
            padding: 35px 25px; text-align: center; width: 100%; max-width: 320px;
        }
        .modal-btn { padding: 14px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; font-size: 12px; }
        .btn-change { background: var(--alpha-red); color: white; }
        .btn-continue { background: transparent; color: #555; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="static-bg"></div>
    <div class="emoji-rain" id="emoji-layer"></div>

    <div class="bg-slogan-wrap">
        <div id="top-bg-slogan">STAY ALPHA</div>
    </div>

    <div class="main-container">
        <div class="review-card">
            <div class="logo-ring"><i class="fas fa-dumbbell" style="font-size: 38px; color: #fff;"></i></div>
            <h1>Alpha Core Fitness</h1>
            <div class="location">Dehrakhas, Dehradun</div>

            <div class="star-box" id="stars">
                <i class="fas fa-star" data-v="1"></i><i class="fas fa-star" data-v="2"></i>
                <i class="fas fa-star" data-v="3"></i><i class="fas fa-star" data-v="4"></i>
                <i class="fas fa-star" data-v="5"></i>
            </div>

            <textarea id="review-text" placeholder="Tap stars for an Alpha review..."></textarea>
            <button class="alpha-btn" onclick="checkRating()">Confirm Review</button>

            <div class="bottom-quote-box">
                <div id="bottom-dynamic-quote">Your only limit is you.</div>
            </div>
        </div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <p style="color:white; font-size: 15px;">Itne kam star or review kyu? 🥲<br><br><b>Stars help us in motivating us.</b></p>
            <div class="modal-btns">
                <button class="modal-btn btn-change" onclick="closeModal()">Theek hai, Change karta hu</button>
                <button class="modal-btn btn-continue" onclick="executeFinalSubmit()">Continue Anyway</button>
            </div>
        </div>
    </div>

    <a href="https://instagram.com/alphacorefitnesss" class="insta-float" target="_blank">
        <i class="fab fa-instagram" style="color: #E1306C; font-size: 16px;"></i> @alphacorefitnesss
    </a>

    <script>
        const RED_FLAGS = ['bad', 'worst', 'dirty', 'rude', 'scam', 'waste', 'bekar', 'ganda', 'bakwas', 'faltu', 'kharab', 'ghatiya'];
        const topSlogans = ["BUILT DIFFERENT", "STAY ALPHA", "LEAVE NO DOUBT", "UNLEASH THE BEAST"];
        const miniQuotes = ["Pain is temporary, pride is forever.", "Dehradun's finest training.", "Alpha mode starts here."];

        document.getElementById('top-bg-slogan').innerText = topSlogans[Math.floor(Math.random() * topSlogans.length)];
        document.getElementById('bottom-dynamic-quote').innerText = miniQuotes[Math.floor(Math.random() * miniQuotes.length)];

        let rating = 0;
        const reviewBox = document.getElementById('review-text');

        // STAR SELECTION
        document.querySelectorAll('#stars i').forEach(star => {
            star.addEventListener('click', function() {
                rating = parseInt(this.getAttribute('data-v'));
                document.querySelectorAll('#stars i').forEach(s => s.classList.toggle('active', s.getAttribute('data-v') <= rating));
                
                if (reviewBox.value === "") {
                    const openings = ["Top-tier gym experience!", "Alpha Core is Dehradun's best.", "Highly professional environment."];
                    const middles = ["Equipment is world-class.", "The energy here is unmatched.", "Extremely clean and focused."];
                    const closers = ["Joining was the best decision!", "Alpha family is the best.", "Recommended for serious gains."];
                    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
                    reviewBox.value = `${pick(openings)} ${pick(middles)} ${pick(closers)}`;
                }
            });
        });

        function checkRating() {
            if (rating === 0) return alert("Select stars first!");
            confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 } });
            if (rating < 4) document.getElementById('custom-modal').style.display = 'flex';
            else executeFinalSubmit();
        }

        function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

        function executeFinalSubmit() {
            const val = reviewBox.value;
            const containsRedFlag = RED_FLAGS.some(flag => val.toLowerCase().includes(flag));
            const reviewUrl = "https://search.google.com/local/writereview?placeid=ChIJ8yvQLQArCTkRGD7Fc7IawW4";

            // Copy to clipboard
            const el = document.createElement('textarea');
            el.value = val;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            if (rating >= 4 && !containsRedFlag) {
                // IMMEDIATE REDIRECT FOR SAFARI COMPATIBILITY
                window.location.href = reviewUrl;
            } else {
                const msg = `🚨 *REPUTATION ALERT*\nRating: ${rating} Stars\nFeedback: ${val}`;
                fetch(`https://api.telegram.org/bot8584187176:AAGbiTxOelG2noQNlsdgPMBCdYCZ-uk67Oc/sendMessage?chat_id=7835819531&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
                alert("Thank you for your feedback!");
                closeModal();
            }
        }

        // EMOJI MOTION
        function createEmoji() {
            const emojis = ['🏋️‍♂️', '💪', '❤️', '⚫'];
            const layer = document.getElementById('emoji-layer');
            const el = document.createElement('div');
            el.className = 'moving-emoji';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = Math.random() * 4 + 6 + 's';
            layer.appendChild(el);
            setTimeout(() => { el.remove(); }, 10000);
        }
        setInterval(createEmoji, 2000);
    </script>
</body>
</html>
