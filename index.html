<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET 720/720 Planner</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff}
nav{display:flex;justify-content:space-around;background:#020617;padding:10px;position:fixed;bottom:0;width:100%}
nav button{background:none;border:none;color:#94a3b8;font-size:12px}
.active{color:#38bdf8}
section{padding:15px;padding-bottom:70px;display:none}
h2{margin-top:0;color:#38bdf8}
.card{background:#020617;padding:12px;border-radius:10px;margin-bottom:10px}
.time{color:#a5f3fc;font-size:12px}
.done{color:#22c55e}
.fullscreen{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.short{height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.short img{width:120px;margin-bottom:15px}
</style>
</head>
<body>

<section id="planner"></section>
<section id="timetable"></section>
<section id="shorts" class="fullscreen"></section>
<section id="completed"></section>
<section id="ai"></section>

<nav>
<button onclick="show('planner')">Planner</button>
<button onclick="show('timetable')">Timetable</button>
<button onclick="show('shorts')">Shorts</button>
<button onclick="show('completed')">Done</button>
<button onclick="show('ai')">AI</button>
</nav>

<script>
const endDate=new Date("2026-02-28");
const today=new Date();
const daysLeft=Math.ceil((endDate-today)/86400000);

const routine={
 lunch:"15:00",
 dinner:"21:30",
 bath:"09:00",
 blockedStart:16,
 blockedEnd:20
};

const syllabus={
 Physics:["Thermodynamics","KTG","Waves","SHM","Electrostatics"],
 Chemistry:["Mole Concept","Thermo","Equilibrium","Electrochemistry"],
 Biology:["Cell","Biomolecules","Genetics","Human Physiology"]
};

let completed=JSON.parse(localStorage.getItem("done")||"[]");

function show(id){
document.querySelectorAll("section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function planner(){
let html=`<h2>📅 Planner (Days left: ${daysLeft})</h2>`;
["Physics","Chemistry","Biology"].forEach(s=>{
html+=`<div class='card'><b>${s}</b><br>${syllabus[s][0]}</div>`;
});
document.getElementById("planner").innerHTML=html;
}

function timetable(){
let blocks=[
"6:00–8:00 Physics",
"8:00–10:00 Chemistry",
"10:30–12:30 Biology",
"14:00–15:00 Revision",
"20:00–22:00 Practice"
];
let html="<h2>⏰ Today's Timetable</h2>";
blocks.forEach(b=>html+=`<div class='card time'>${b}</div>`);
document.getElementById("timetable").innerHTML=html;
}

const shortsData=[
{t:"Thermodynamics",c:"ΔQ = ΔU + W",i:"https://img.icons8.com/color/200/physics.png"},
{t:"Genetics",c:"Law of segregation",i:"https://img.icons8.com/color/200/dna.png"},
{t:"Electrochem",c:"Nernst Equation",i:"https://img.icons8.com/color/200/battery.png"}
];
let shortIndex=0;

function loadShort(){
const s=shortsData[shortIndex%shortsData.length];
document.getElementById("shorts").innerHTML+=`
<div class='short'>
<div>
<img src='${s.i}'><h2>${s.t}</h2><p>${s.c}</p>
</div>
</div>`;
shortIndex++;
}

document.getElementById("shorts").addEventListener("scroll",()=>{
if(shortIndex<100)loadShort();
});

function ai(){
document.getElementById("ai").innerHTML=`
<h2>🧠 AI Support</h2>
<div class='card'>You're doing great. Focus on execution today.</div>`;
}

planner(); timetable(); ai(); loadShort(); show("planner");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET 720/720 Autonomous Planner</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:system-ui;background:#020617;color:#e5e7eb}
header{padding:14px;text-align:center;border-bottom:1px solid #1e293b}
h1{font-size:18px;margin:0}
#countdown{color:#38bdf8;font-size:13px;margin-top:4px}
nav{display:flex;justify-content:space-around;padding:8px;background:#020617;border-top:1px solid #1e293b;position:fixed;bottom:0;width:100%}
nav button{background:none;border:none;color:#94a3b8;font-size:13px}
nav button.active{color:#22c55e}
.section{display:none;padding-bottom:80px}
.section.active{display:block}
.card{margin:10px;padding:12px;background:#020617;border-left:4px solid #22c55e;border-radius:8px}
.subject{font-weight:bold;color:#facc15;margin-top:5px}
.chapter{font-weight:bold;color:#38bdf8;margin-top:2px}
.topic{font-size:13px;margin-top:2px}
.note{font-size:12px;color:#94a3b8}
button.small{padding:4px 8px;border:none;border-radius:6px;font-size:12px;margin-right:4px}
.done{background:#16a34a}
.miss{background:#dc2626}
.completed{border-left-color:#16a34a}
.sunday{border-left-color:#38bdf8}
input{width:100%;padding:6px;margin-top:6px;background:#020617;border:1px solid #334155;color:#e5e7eb;border-radius:6px}
.ai{background:#020617;border-left:4px solid #a855f7}
.chat{font-size:13px;margin-top:6px}
.chat b{color:#a855f7}
#shortContainer{height:120px;padding:10px;border:1px solid #334155;border-radius:8px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>NEET 720/720 Planner</h1>
<div id="countdown"></div>
</header>

<!-- Planner Section -->
<div id="plan" class="section active"></div>
<div id="completed" class="section"></div>

<!-- Shorts Section -->
<div id="shorts" class="section">
<div class="card">
<h3>🎬 NEET Shorts – Scroll for concepts</h3>
<div id="shortContainer"></div>
<div style="margin-top:8px;text-align:center">
<button onclick="prevShort()" class="small">◀ Prev</button>
<button onclick="nextShort()" class="small">Next ▶</button>
</div>
</div>
</div>

<!-- Settings Section -->
<div id="settings" class="section">
<div class="card">
<h3>⏰ Customize Routine</h3>
<label>Lunch Time</label>
<input id="lunch" type="time">
<label>Dinner Time</label>
<input id="dinner" type="time">
<label>Bath / Fresh Time</label>
<input id="bath" type="time">
<button class="small done" onclick="saveRoutine()">Save</button>
</div>
</div>

<!-- AI Section -->
<div id="ai" class="section">
<div class="card ai">
<h3>🤖 NEET AI Companion</h3>
<div class="chat" id="chat"><b>AI:</b> I’m here for you. Ask anything.</div>
<input id="msg" placeholder="Type your query..." onkeydown="if(event.key==='Enter')replyAI()">
</div>
</div>

<nav>
<button onclick="show('plan')" class="active">Planner</button>
<button onclick="show('completed')">Completed</button>
<button onclick="show('shorts')">Shorts</button>
<button onclick="show('settings')">Settings</button>
<button onclick="show('ai')">AI</button>
</nav>

<script>
// Countdown
const exam=new Date("May 5, 2026 09:00").getTime();
setInterval(()=>{document.getElementById("countdown").innerText=
Math.floor((exam-Date.now())/86400000)+" Days Left"},1000);

// Routine
let routine=JSON.parse(localStorage.getItem("routine"))||{lunch:'15:00',dinner:'21:30',bath:'21:00'};
document.getElementById("lunch").value=routine.lunch;
document.getElementById("dinner").value=routine.dinner;
document.getElementById("bath").value=routine.bath;
function saveRoutine(){
routine.lunch=lunch.value;routine.dinner=dinner.value;routine.bath=bath.value;
localStorage.setItem("routine",JSON.stringify(routine));
alert("Routine Saved");
generatePlanner();
}

// Subjects & Chapters
const subjects=["Physics","Chemistry","Biology"];
const chapters={
"Physics":[
{"chapter":"Thermodynamics","topics":["Laws","Heat Engines","Entropy"]},
{"chapter":"Electrostatics","topics":["Coulomb's Law","Capacitors","Gauss's Law"]},
{"chapter":"Magnetism","topics":["Biot-Savart","Ampere's Law"]}
],
"Chemistry":[
{"chapter":"Organic","topics":["Hydrocarbons","Alcohols","Aldehydes"]},
{"chapter":"Inorganic","topics":["Periodic Table","Chemical Bonding"]},
{"chapter":"Physical","topics":["Mole Concept","Thermodynamics"]}
],
"Biology":[
{"chapter":"Genetics","topics":["Mendel's Laws","DNA","RNA"]},
{"chapter":"Human Physiology","topics":["Circulatory","Respiratory","Digestive"]},
{"chapter":"Cell Biology","topics":["Cell Cycle","Mitosis","Meiosis"]}]
};

// Planner generation
function generatePlanner(){
const plan=document.getElementById("plan");
const completed=document.getElementById("completed");
plan.innerHTML=""; completed.innerHTML="";
let saved=JSON.parse(localStorage.getItem("progress"))||{};
let today=new Date();
let end=new Date("Feb 28,2026 23:59");
let timeBlocks=[
  {start:'06:00',end:routine.lunch},
  {start:routine.lunch,end:'16:00'},
  {start:'20:00',end:routine.dinner},
  {start:routine.dinner,end:'23:00'}
];
for(let d=new Date(today);d<=end;d.setDate(d.getDate()+1)){
  let dayStr=d.toDateString();
  let card=`<div class="card ${d.getDay()==0?'sunday':''}"><b>${dayStr}</b>`;
  let compCard=`<div class="card completed"><b>${dayStr}</b>`;
  if(d.getDay()==0){
    card+=`<div class="subject">REVISION DAY</div><div class="topic">Full syllabus revision + 1 mock test</div>`;
  }else{
    let subjIndex=0;
    subjects.forEach(s=>{
      chapters[s].forEach(c=>{
        card+=`<div class="subject">${s}</div><div class="chapter">${c.chapter}</div>`;
        c.topics.forEach(t=>{
          let key=dayStr+"_"+s+"_"+c.chapter+"_"+t;
          let status=saved[key]||0;
          let block=timeBlocks[subjIndex % timeBlocks.length];
          card+=`<div class="topic">${t} <span class="note">(${block.start} - ${block.end})</span>
          <button class="small ${status==1?'done':'miss'}" onclick="mark('${key}',1)">✔</button>
          <button class="small ${status==0?'miss':'done'}" onclick="mark('${key}',0)">✖</button></div>`;
          if(status==1) compCard+=`<div class="topic">${s} - ${c.chapter} - ${t}</div>`;
          subjIndex++;
        });
      });
    });
  }
  card+="</div>"; compCard+="</div>";
  plan.innerHTML+=card;
  completed.innerHTML+=compCard;
}
}

// Mark topic complete/incomplete
function mark(key,v){
let saved=JSON.parse(localStorage.getItem("progress"))||{};
saved[key]=v;
localStorage.setItem("progress",JSON.stringify(saved));
generatePlanner();
}

// NEET Shorts – YouTube style
const shorts=[
"Physics: Carnot Engine η=1-T2/T1",
"Physics: Capacitance decreases in series",
"Chemistry: Coordination number ≠ oxidation state",
"Chemistry: GOC Resonance > Inductive",
"Biology: NCERT lines important",
"Biology: Human Physiology 45% paper"
];
let shortIndex=0;
function showShort(){document.getElementById("shortContainer").innerText=shorts[shortIndex];}
function nextShort(){shortIndex=(shortIndex+1)%shorts.length;showShort();}
function prevShort(){shortIndex=(shortIndex-1+shorts.length)%shorts.length;showShort();}
setInterval(nextShort,10000);
showShort();

// Tabs
function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
}

// AI Companion
function replyAI(){
let m=msg.value.toLowerCase();
let r="Breathe. You are capable.";
if(m.includes("tired"))r="Rest 10 mins, then continue Biology NCERT.";
if(m.includes("demotivated"))r="Remember your goal. One topic at a time builds 720/720.";
if(m.includes("stuck"))r="Focus on completing the next topic in planner.";
if(m.includes("help"))r="Check NEET Shorts tab for formulas & key points.";
chat.innerHTML+=`<br><b>You:</b> ${msg.value}<br><b>AI:</b> ${r}`;
msg.value="";
}

// Initialize planner
generatePlanner();

// PWA service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').then(()=>console.log("SW Registered"));}
</script>
</body>
</html>
