<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha Core Fitness | Official Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --alpha-red: #ff3131; --glass: rgba(10, 10, 10, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Background updated using the exact style from untitled.html */
        body, html { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&q=80'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
            position: relative; 
        }

        /* Hiding the old static-bg to use the new body background */
        .static-bg { display: none; }
        
        .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px 20px; position: relative; z-index: 10; }
        
        .review-card { background: var(--glass); border: 2px solid rgba(255, 49, 49, 0.4); border-radius: 40px; padding: 75px 25px 45px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 0 50px rgba(255, 49, 49, 0.15); position: relative; backdrop-filter: blur(15px); }
        
        .brand-header { margin-bottom: 30px; }
        .brand-header h1 { font-family: 'Montserrat', sans-serif; font-size: 34px; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: 1px; color: #fff; line-height: 1; }
        .brand-header .location { color: var(--alpha-red); font-weight: 800; font-size: 12px; letter-spacing: 6px; text-transform: uppercase; margin-top: 10px; }

        .logo-ring { width: 90px; height: 90px; background: var(--alpha-red); position: absolute; top: -45px; left: 50%; transform: translateX(-50%); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 6px solid #000; box-shadow: 0 15px 30px rgba(255, 49, 49, 0.4); z-index: 2; }

        .star-box { display: flex; justify-content: center; gap: 14px; margin: 30px 0; }
        .star-box i { font-size: 38px; color: #333; cursor: pointer; transition: 0.3s; }
        .star-box i.active { color: #FFD700; transform: scale(1.2); text-shadow: 0 0 25px rgba(255, 215, 0, 0.6); }

        textarea { width: 100%; height: 150px; background: rgba(255,255,255,0.08); border: 2px solid #2a2a2a; border-radius: 24px; padding: 20px; color: #fff; font-size: 15px; line-height: 1.6; resize: none; outline: none; margin-bottom: 25px; }
        
        .alpha-btn { background: var(--alpha-red); color: #fff; border: none; width: 100%; padding: 22px; border-radius: 50px; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: 16px; box-shadow: 0 12px 24px rgba(255, 49, 49, 0.4); }

        .slogan-container { margin-top: 45px; } 
        #dynamic-slogan { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 26px; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }

        .insta-fab { position: fixed; bottom: 30px; left: 20px; z-index: 1000; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); padding: 12px 24px; border-radius: 50px; display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-weight: 700; font-size: 13px; }

        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: #0a0a0a; border: 2px solid var(--alpha-red); border-radius: 30px; padding: 40px 25px; text-align: center; width: 100%; max-width: 340px; }
        .modal-btn { padding: 16px; border-radius: 50px; border: none; font-weight: 700; width: 100%; margin-top: 12px; cursor: pointer; text-transform: uppercase; }
        .btn-change { background: var(--alpha-red); color: white; }
        .btn-continue { background: transparent; color: #555; border: 1px solid #222; font-size: 11px; }
    </style>
</head>
<body>

    <div class="static-bg"></div>

    <div class="main-container">
        <div class="review-card">
            <div class="logo-ring"><i class="fas fa-dumbbell" style="font-size: 42px; color: #fff;"></i></div>
            
            <div class="brand-header">
                <h1>ALPHA CORE FITNESS</h1>
                <div class="location">Dehrakhas, Dehradun</div>
            </div>

            <div class="star-box" id="stars">
                <i class="fas fa-star" data-v="1"></i><i class="fas fa-star" data-v="2"></i>
                <i class="fas fa-star" data-v="3"></i><i class="fas fa-star" data-v="4"></i>
                <i class="fas fa-star" data-v="5"></i>
            </div>

            <textarea id="review-text" placeholder="Tap stars for an Alpha review..."></textarea>
            <button class="alpha-btn" onclick="checkRating()">Confirm Review</button>
            
            <div class="slogan-container">
                <div id="dynamic-slogan">STAY ALPHA</div>
            </div>
        </div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <p style="color:white; font-size: 16px; line-height: 1.5; margin-bottom: 20px;">Itne kam star or review kyu? 🥲<br><br><b>Stars help us in motivating us.</b></p>
            <button class="modal-btn btn-change" onclick="closeModal()">Theek hai, Change karta hu</button>
            <button class="modal-btn btn-continue" onclick="executeFinalSubmit()">Continue Anyway</button>
        </div>
    </div>

    <a href="https://www.instagram.com/alphacorefitnesss?igsh=ejk3OWlibmNwZmtw" class="insta-fab" target="_blank">
        <i class="fab fa-instagram"></i>
        <span>ALPHA CORE FITNESS</span>
    </a>

    <script>
        const RED_FLAGS = ['bad', 'worst', 'dirty', 'rude', 'scam', 'waste', 'bekar', 'ganda', 'bakwas', 'faltu', 'kharab', 'ghatiya'];
        
        const Matrix = {
            hi_pure: ["बेहतरीन जिम और शानदार माहौल। साफ़-सफाई और मशीनें एकदम टॉप क्लास हैं। अल्फा कोर नंबर 1 है!", "देहरादून का सबसे अच्छा फिटनेस सेंटर। यहाँ वर्कआउट करने का मज़ा ही अलग है।", "लाजवाब वाइब और हेल्पफुल ट्रेनर्स। फिटनेस के लिए बेस्ट जगह।"],
            en: ["Outstanding training facility!", "Professional environment with top-tier equipment.", "Best gym experience in Dehradun.", "Highly recommended for serious athletes.", "Exceptional energy and world-class standards."],
            hgl: ["Bhai kya gym banaya hai!", "Gains chahiye toh yahi aao.", "Ek number vibes aur results.", "Maza aa gaya workout karke.", "Full paisa vasool vibe hai yahan.", "Dehradun ka sabse best gym."],
            slogans: ["BUILT DIFFERENT", "STAY ALPHA", "LEAVE NO DOUBT", "UNLEASH", "NO EXCUSES", "DOMINATE"]
        };

        let rating = 0;
        const reviewBox = document.getElementById('review-text');
        const sloganBox = document.getElementById('dynamic-slogan');
        const modal = document.getElementById('custom-modal');
        const pick = (arr) => arr[arr.length * Math.random() | 0];

        document.querySelectorAll('#stars i').forEach(star => {
            star.onclick = () => {
                rating = parseInt(star.getAttribute('data-v'));
                document.querySelectorAll('#stars i').forEach(s => s.classList.toggle('active', s.getAttribute('data-v') <= rating));
                sloganBox.innerText = pick(Matrix.slogans);

                let roll = Math.random();
                let review = "";
                if (roll < 0.20) {
                    review = pick(Matrix.hi_pure);
                } else {
                    let fragments = [pick(Matrix.en), pick(Matrix.hgl)];
                    if(Math.random() > 0.5) fragments.push(pick(Matrix.en));
                    review = fragments.join(' ');
                }
                reviewBox.value = review;
            };
        });

        function checkRating() {
            if (rating === 0) return alert("Select stars first!");
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            if (rating < 4) modal.style.display = 'flex';
            else executeFinalSubmit();
        }

        function closeModal() { modal.style.display = 'none'; }

        function executeFinalSubmit() {
            const val = reviewBox.value;
            const containsRedFlag = RED_FLAGS.some(flag => val.toLowerCase().includes(flag));
            const reviewUrl = "https://search.google.com/local/writereview?placeid=ChIJ8yvQLQArCTkRGD7Fc7IawW4";
            
            const el = document.createElement('textarea');
            el.value = val;
            document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el);

            if (rating >= 4 && !containsRedFlag) {
                window.location.href = reviewUrl;
            } else {
                fetch(`https://api.telegram.org/bot8584187176:AAGbiTxOelG2noQNlsdgPMBCdYCZ-uk67Oc/sendMessage?chat_id=7835819531&text=${encodeURIComponent("🚨 REPUTATION ALERT\nRating: " + rating + "\nFeedback: " + val)}`);
                alert("Thank you for your feedback!");
                closeModal();
            }
        }
    </script>
</body>
</html>
